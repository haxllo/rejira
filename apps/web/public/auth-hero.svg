<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 1088" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F5F1"/>
      <stop offset="100%" stop-color="#EEEAE2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF9F5"/>
    </linearGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B26A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8B26A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8B26A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#F0B36B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F0B36B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#000" fill-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
