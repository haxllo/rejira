name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + lint + db:test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ─── 1. Typecheck ─────────────────────────────────────
      - name: Typecheck
        run: npm run typecheck

      # ─── 2. Lint ──────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ─── 3. Supabase local + Drizzle + RLS + auth tests ──
      # We start the local Supabase stack in CI, apply migrations,
      # run the seed, and execute the Vitest suite (RLS, Drizzle
      # transactions, Better Auth flow). No remote Supabase
      # project is required — `supabase start` is self-contained.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations
        run: supabase db reset --no-seed

      - name: Supabase DB lint + drift detection
        run: |
          supabase db lint
          supabase db diff > /tmp/drift.sql
          if [ -s /tmp/drift.sql ]; then
            echo "::error::Database drift detected. Run 'npm run db:generate' and commit the result."
            cat /tmp/drift.sql
            exit 1
          fi

      - name: Seed the demo workspace
        run: npm run db:seed

      - name: Vitest: RLS + Drizzle + auth tests
        run: npm run db:test

      # ─── 4. Build the Next.js app ─────────────────────────
      - name: Build
        env:
          # The build doesn't need a real Supabase URL; the
          # components render the seed/mock data when no
          # Drizzle queries fire. Set a placeholder so
          # NEXT_PUBLIC_* inlining succeeds.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build
